name: Deploy Update Site to GitHub Pages (docs/)

on:
  push:
    branches: [ main ]  # Trigger on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to avoid issues with Git operations

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven (Tycho)
        run: mvn clean verify

      - name: Prepare docs/ folder
        run: |
          # Create docs/ folder and clear it
          mkdir -p docs
          rm -rf docs/*

          # Copy the update site files to docs/
          cp -r org.bio7.pi4j.updatesite/target/repository/* docs/

      - name: Commit and push docs/ to main branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Add, commit, and push docs/ to the main branch
          git add docs/
          git commit -m "Deploy update site to docs/ [skip ci]"
          git push
